[package]
name = "axum-push-example"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-push-native = "0.3" # Native Rust library for VAPID/WebPush
base64ct = { version = "1.6", features = ["alloc"] } # Utility for decoding VAPID strings
reqwest = { version = "0.13", features = ["json"] }
tower-http = { version = "0.6", features = ["fs"] }
